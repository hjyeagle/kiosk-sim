<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 대화 연습실 - 시니어 AI 따라하기 5편</title>
<style>
:root{--o:#e65c00;--o2:#fff1e6;--ink:#222;--bg:#f6f1ea;--g:#2e7d32;--y:#fff3b0;--b:#1f2430}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
body{font-size:clamp(14px,min(1.9vh,4.2vw),21px);line-height:1.5}
.col{width:min(100%,28em);margin:0 auto;padding:.6em .6em 2em}
h1{font-size:1.35em;margin:.2em 0 .1em;display:flex;align-items:baseline;gap:.5em;flex-wrap:wrap}
h1 small{font-size:.6em;font-weight:400;color:#666}
.modes{display:flex;gap:.5em;margin:.4em 0 .6em}
.modes button{flex:1;font:inherit;font-weight:700;padding:.5em;border-radius:2em;border:2px solid var(--o);background:#fff;color:var(--o);cursor:pointer}
.modes button.on{background:var(--o);color:#fff}
.phone{background:var(--b);border-radius:1.2em;padding:.5em;box-shadow:0 .4em 1em #0003}
.top{background:#fff;border-radius:.8em .8em 0 0;padding:.5em .8em;font-weight:700;display:flex;align-items:center;gap:.5em;border-bottom:1px solid #eee}
.dot{width:.7em;height:.7em;border-radius:50%;background:#4caf50}
#chat{background:#fbf8f3;height:min(58vh,34em);overflow-y:auto;padding:.7em;scroll-behavior:smooth;position:relative}
.m{max-width:94%;margin:.5em 0;padding:.6em .8em;border-radius:.9em;font-size:.95em;word-break:keep-all}
.me{margin-left:auto;background:var(--o);color:#fff;border-bottom-right-radius:.2em}
.ai{background:#fff;border:1px solid #e6ddd0;border-bottom-left-radius:.2em}
.ai h4{margin:.7em 0 .25em;font-size:1em}
.ai h4:first-child{margin-top:0}
.ai table{border-collapse:collapse;width:100%;font-size:.82em;margin:.3em 0}
.ai th,.ai td{border:1px solid #ddd;padding:.3em .4em;text-align:left;vertical-align:top}
.ai th{background:#f3eee6}
.ai ol,.ai ul{margin:.2em 0;padding-left:1.2em}
.ai li{margin:.15em 0}
.typing span{display:inline-block;width:.5em;height:.5em;margin:0 .15em;border-radius:50%;background:#bbb;animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes b{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-.4em)}}
.blk{border-radius:.6em;padding:.4em .5em;margin:.4em 0;border:2px solid transparent}
.blk.hl{border-color:var(--o);background:var(--y);cursor:pointer;animation:pulse 1.2s infinite}
.blk.hl::before{content:"👆 여기를 눌러 보세요";display:block;background:var(--o);color:#fff;font-weight:700;border-radius:.5em;padding:.2em .6em;margin-bottom:.3em;width:max-content;max-width:100%}
#hint{background:var(--o);color:#fff;font-weight:700;padding:.5em .8em;font-size:.95em;line-height:1.4}
#hint:empty{display:none}
.blk.done{background:#e8f5e9;border-color:#a5d6a7}
.blk.done::after{content:" ✓ 확인함";color:var(--g);font-weight:700;font-size:.85em}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #e65c0088}50%{box-shadow:0 0 0 .45em #e65c0000}}
.bar{background:#fff;border-radius:0 0 .8em .8em;padding:.5em;display:flex;gap:.4em;align-items:flex-end}
#inp{flex:1;font-size:.82em;min-height:3.4em;max-height:5.2em;overflow:auto;background:#f4f1ec;border-radius:.6em;padding:.4em .6em;color:#555}
#inp.empty{color:#aaa}
#send{font:inherit;font-weight:700;background:#bbb;color:#fff;border:0;border-radius:.7em;padding:.7em .9em;cursor:default}
#send.hl{background:var(--g);cursor:pointer;animation:pulse 1.2s infinite}
.final{display:block;width:100%;font:inherit;font-weight:700;background:var(--g);color:#fff;border:0;border-radius:.8em;padding:.7em;margin:.5em 0;cursor:pointer;animation:pulse 1.2s infinite}
.guide{background:#fff;border-radius:1em;padding:.7em .8em;margin-top:.7em;box-shadow:0 .2em .6em #0002}
.gh{display:flex;align-items:center;gap:.6em}
.badge{background:var(--o);color:#fff;font-weight:700;border-radius:2em;padding:.15em .7em;white-space:nowrap}
.prog{flex:1;display:flex;gap:.25em}.prog i{flex:1;height:.45em;border-radius:1em;background:#ddd}.prog i.on{background:var(--o)}
#gt{font-size:1.1em;font-weight:700;margin:.5em 0}
#gc{background:#fff8e1;border-left:.3em solid #f5a623;padding:.4em .6em;border-radius:.3em;font-size:.92em}
.btns{display:flex;gap:.4em;flex-wrap:wrap;margin-top:.6em}
.btns button,.btns select{font:inherit;font-size:.85em;padding:.35em .7em;border-radius:.6em;border:1px solid #ccc;background:#fafafa;cursor:pointer}
.note{font-size:.8em;color:#777;margin-top:.5em}
.links{font-size:.85em;margin-top:.6em}.links a{color:var(--o)}
.finger{position:fixed;width:2em;height:2em;border-radius:50%;background:#e65c0099;border:2px solid var(--o);pointer-events:none;z-index:9;transition:left .7s ease,top .7s ease;display:none}
.finger.tap{transform:scale(.7)}
.copy{background:#f4f1ec;border-radius:.6em;padding:.5em .7em;font-size:.9em;margin:.5em 0}
</style>
</head>
<body>
<div class="col">
<h1>💬 AI 대화 연습실 <small>시니어 AI 따라하기 5편 · 일정 정리</small></h1>
<div class="modes"><button id="mWatch">👀 따라보기</button><button id="mTry" class="on">👆 직접 해보기</button></div>

<div class="phone">
  <div class="top"><span class="dot"></span>AI 도우미 (연습용)</div>
  <div id="hint"></div>
  <div id="chat"></div>
  <div class="bar"><div id="inp" class="empty">여기에 말하듯 적어서 보냅니다</div><button id="send">보내기</button></div>
</div>

<div class="guide">
  <div class="gh"><span class="badge" id="gb">1단계 / 6</span><div class="prog" id="gp"></div></div>
  <div id="gt"></div>
  <div id="gc"></div>
  <div class="btns">
    <button id="bPrev">◀ 이전</button>
    <button id="bPlay" style="display:none">▶ 재생</button>
    <button id="bRe">↻ 처음부터</button>
    <select id="spd"><option value="1">보통 속도</option><option value="1.6">천천히</option></select>
    <button id="bTts">🔊 읽어주기 끄기</button>
  </div>
  <div class="note">※ 연습용 화면입니다. 실제 AI와 연결되어 있지 않고, 같은 대화가 매번 똑같이 나옵니다. 개인정보는 입력하지 않아요.</div>
  <div class="links"><a href="https://newstoday.co.kr/biznetimes-ai-5/">← 뉴스투데이 5편 글로 돌아가기</a> · <a href="https://newstoday.co.kr/">뉴스투데이 홈</a></div>
</div>
</div>
<div class="finger" id="fg"></div>

<script>
const Q1="다음 주 일정을 정리해 줘. 월요일(19일) 오전 10시에 업무회의가 있고, 화요일(20일) 오후 2시에 거래처 미팅이 있어. 수요일(21일) 오전에는 S병원 건강검진이 있는데 금식이라 9시까지 가야 해. 목요일(22일) 저녁 6시에 동창 모임이 있고, 금요일(23일)에는 지방(부산) 출장이야. 토요일(24일)에는 저녁 5시 가족저녁모임이 예정되어 있어. 모든 일정들을 요일별 표로 정리하고, 겹치거나 무리한 부분이 있으면 알려줘.";
const Q2="부산출장(23일): 출발 - 23일 오전 7시 비행기, 서울도착 - 24일 오전 9시. 동창모임(22일): 저녁 6시, 다음날 부산출장 일정으로 늦어도 10시까지 귀가 예정. 거래처 미팅(20일): 강남지역으로 교통체증이 심한 곳이라 대중교통 이용 예정.";
const A1=`<h4>요약</h4>시간이 직접 겹치는 일정은 없습니다. 다만 <b>목요일 저녁 → 금요일 부산 출장 → 토요일 저녁 가족모임</b>으로 이어지는 3일이 가장 빡빡합니다. 수요일 건강검진 당일도 일정을 비워 두는 편이 안전합니다.
<h4>일정표</h4><table><tr><th>날짜</th><th>시간</th><th>일정</th><th>비고</th></tr>
<tr><td>월(19일)</td><td>오전 10:00</td><td>업무회의</td><td>주 초반이라 여유 있음</td></tr>
<tr><td>화(20일)</td><td>오후 2:00</td><td>거래처 미팅</td><td>오전 시간 활용 가능</td></tr>
<tr><td>수(21일)</td><td>오전 ~9:00 도착</td><td>S병원 건강검진</td><td>전날 밤부터 금식 필요</td></tr>
<tr><td>목(22일)</td><td>저녁 6:00</td><td>동창 모임</td><td>귀가가 늦어질 수 있음</td></tr>
<tr><td>금(23일)</td><td>종일</td><td>부산 출장</td><td>출발·복귀 시각 미정</td></tr>
<tr><td>토(24일)</td><td>저녁 5:00</td><td>가족저녁모임</td><td>금요일 복귀 상황에 따라 컨디션 영향</td></tr></table>
<div class="blk" id="tTight"><h4>겹치거나 무리한 부분</h4><ol>
<li><b>목요일 저녁 → 금요일 출장 (가장 주의)</b><br>모임이 길어지면 다음 날 이른 출발이 부담됩니다. 금요일 출발이 이른 편이라면 모임을 일찍 마무리하거나 전날 짐을 미리 싸 두세요.</li>
<li><b>수요일 검진 당일</b><br>금식 후 검진이라 오전 이후 컨디션이 떨어질 수 있습니다. 오후는 비워 두세요.</li>
<li><b>금요일 출장 → 토요일 가족모임</b><br>복귀가 금요일 밤 늦으면 토요일 모임까지 휴식이 짧습니다.</li>
<li><b>화요일 거래처 미팅</b><br>시간은 충분합니다. 장소와 이동 시간만 확인하세요.</li></ol></div>
<div class="blk" id="tNeed"><h4>확인이 필요한 정보</h4><ul>
<li>부산 출장의 출발·복귀 시각, 이동 수단</li><li>동창 모임 장소, 예상 종료 시각</li><li>거래처 미팅 장소</li></ul></div>`;
const A2=`<h4>수정 일정표</h4><table><tr><th>날짜</th><th>시간</th><th>일정</th><th>점검 의견</th></tr>
<tr><td>월(19일)</td><td>10:00</td><td>업무회의</td><td>특이사항 없음</td></tr>
<tr><td>화(20일)</td><td>14:00</td><td>거래처 미팅 (강남, 대중교통)</td><td>지하철 우선, 약속 30분 전 도착 권장</td></tr>
<tr><td>수(21일)</td><td>~09:00 도착</td><td>S병원 건강검진</td><td>금식, 오후는 비워 둘 것</td></tr>
<tr><td>목(22일)</td><td>18:00~22:00</td><td>동창 모임</td><td>22시 귀가는 현실적으로 빠듯함</td></tr>
<tr><td>금(23일)</td><td>07:00 비행기</td><td>부산 출장 (1박)</td><td>새벽 기상 필요</td></tr>
<tr><td>토(24일)</td><td>09:00 서울 도착</td><td>부산 → 서울 복귀</td><td>17:00 가족모임까지 약 8시간 여유</td></tr>
<tr><td>토(24일)</td><td>17:00</td><td>가족저녁모임</td><td>복귀 후 휴식 후 참석 가능</td></tr></table>
<div class="blk" id="tCheck"><h4>주요 점검사항</h4><ol>
<li><b>목요일 모임과 금요일 새벽 비행기 (가장 중요)</b><ul>
<li>오전 7시 국내선이면 출발 1시간 전 도착 기준으로 <b>오전 6시 공항 도착</b>이 필요합니다.</li>
<li>집에서 공항까지 약 1시간이면 <b>오전 4시 30분~5시 기상</b>입니다. 22시 귀가 후 취침하면 수면은 6시간 안팎입니다.</li>
<li>제안: 모임 시작 때 "9시 전후로 일어나겠다"고 미리 양해를 구하고, 짐은 미리 싸 두세요.</li></ul></li>
<li><b>화요일 강남 미팅</b><ul><li>대중교통은 정체 영향이 적어 적절한 선택입니다.</li>
<li>출발 시각 = 14시에서 (이동 시간 + 환승 여유 10분 + 도착 후 여유 20~30분)을 뺀 시각. 이동이 1시간이면 12시 30분 전후 출발입니다.</li></ul></li>
<li><b>수요일 검진</b><ul><li>목요일 모임에 영향이 없도록 검진 후 식사와 휴식 시간을 확보하세요.</li></ul></li>
<li><b>24일(토) 복귀</b><ul><li>부산에서 서울 도착이 오전 9시이므로 오전 중 이른 비행기가 됩니다. 토요일 아침도 일찍 시작하게 되니, 금요일 밤은 업무 후 일찍 쉬시는 것이 좋습니다.</li></ul></li></ol></div>`;
const SAMPLE="다음 주 일정을 정리해 줘. 월요일 오전에 회의가 있고, 수요일 저녁에 친구 모임이 있고, 금요일에는 병원 가는 날이야. 요일별 표로 정리하고, 겹치거나 무리한 부분이 있으면 알려줘. 더 알아야 할 게 있으면 나한테 물어봐 줘.";

const STEPS=[
 {t:"일정을 순서나 형식 없이, 머릿속에 있는 대로 말하듯 적어서 ‘보내기’를 눌러 주세요.",c:"맞춤법이나 순서는 신경 쓰지 않아도 됩니다. 아래 글은 예시이고, 연습실에서는 ‘보내기’만 누르시면 됩니다.",tg:"send"},
 {t:"AI가 일정을 표로 정리해 줬어요. 노랗게 반짝이는 ‘겹치거나 무리한 부분’을 눌러 보세요.",c:"AI는 표를 만들 뿐 아니라, 빠듯한 날도 먼저 짚어 줍니다. 목요일 저녁 → 금요일 출장 → 토요일 모임이 가장 빡빡하다고 알려줬어요.",tg:"tTight"},
 {t:"AI가 ‘확인이 필요한 정보’를 되물었어요. 반짝이는 곳을 눌러 보세요.",c:"AI가 되물어 오는 것은 대화가 잘 되고 있다는 신호입니다. 이 질문에 답해 줄수록 결과가 훨씬 좋아져요.",tg:"tNeed"},
 {t:"AI가 물어본 것에 구체적으로 답해서 ‘보내기’를 눌러 주세요.",c:"시각, 장소, 이동 수단을 구체적으로 알려주면 좋습니다. 한 번에 다 못 써도 괜찮고, 아는 만큼만 답하세요.",tg:"send"},
 {t:"AI가 출발 시각과 기상 시각까지 거꾸로 계산해 줬어요. ‘주요 점검사항’을 눌러 보세요.",c:"처음 답보다 훨씬 구체적이지요? 한 번에 끝내지 않고 2~3번 주고받으면서 고쳐 가는 것이 요령입니다.",tg:"tCheck"},
 {t:"이제 내 일정으로 해 볼 차례입니다. 초록색 버튼을 눌러 주세요.",c:"처음 질문에서 AI가 틀린 말을 하면 \"이 부분은 틀렸어, 다시 해줘\"라고 말해도 됩니다.",tg:"final"}
];
const LAST=STEPS.length-1;
const $=id=>document.getElementById(id);
let mode="try",idx=0,busy=false,tts=true,playing=false,timer=null,spd=1;
const chat=$("chat"),inp=$("inp"),send=$("send");

function bub(cls,html){const d=document.createElement("div");d.className="m "+cls;d.innerHTML=html;chat.appendChild(d);return d}
function setInp(t){inp.textContent=t||"여기에 말하듯 적어서 보냅니다";inp.className=t?"":"empty"}
function mark(i,on){const e=$(i);if(e)e.classList.remove("hl","done"),on&&e.classList.add(on)}
function scrollTo(el){if(!el)return;chat.scrollTop=Math.max(0,el.offsetTop-chat.offsetTop-20)}
function scrollEnd(){chat.scrollTop=chat.scrollHeight}

function build(i){ // 상태를 즉시 재구성
  chat.innerHTML="";setInp("");send.className="";
  if(i>=1){bub("me",Q1);bub("ai",A1)}
  if(i>=4){bub("me",Q2);bub("ai",A2)}
  if(i===0){setInp(Q1);send.className="hl"}
  if(i===3){setInp(Q2);send.className="hl"}
  ["tTight","tNeed","tCheck"].forEach((k,n)=>{const need=[1,2,4][n];
    if(i>need)mark(k,"done");else if(i===need)mark(k,"hl")});
  if(i===5){const b=document.createElement("button");b.className="final";b.id="final";b.textContent="✍ 내 일정으로 해 보기";chat.appendChild(b)}
  idx=i;render();
  const tgEl=$(STEPS[i]&&STEPS[i].tg);
  if(i===1||i===2||i===4)scrollTo(tgEl);else scrollEnd();
}
function render(){
  const done=idx>LAST;
  $("gb").textContent=done?"완료":(idx+1)+"단계 / "+STEPS.length;
  $("gp").innerHTML=STEPS.map((_,n)=>`<i class="${n<=idx?"on":""}"></i>`).join("");
  if(done){
    $("hint").textContent="";$("gt").textContent="🎉 AI 대화 연습이 모두 끝났어요! 아래 예시를 복사해서 AI에게 내 일정을 보내 보세요.";
    $("gc").innerHTML=`<div class="copy" id="sample">${SAMPLE}</div><button id="bCopy" class="final" style="animation:none">📋 예시 문장 복사하기</button>`;
    $("bCopy").onclick=()=>{try{navigator.clipboard.writeText(SAMPLE);$("bCopy").textContent="✅ 복사됐어요! AI 앱에 붙여넣기 하세요"}catch(e){$("bCopy").textContent="길게 눌러서 복사해 주세요"}};
    chat.innerHTML="";
    bub("ai","🎉 수고하셨습니다! 이제 내 일정을 AI에게 말하듯 보내 보세요.<div class='copy'>"+SAMPLE+"</div><button class='final' id='cCopy' style='animation:none'>📋 이 문장 복사하기</button><div style='font-size:.85em;color:#666'>복사한 뒤 휴대폰의 AI 앱에 붙여넣고, 일정은 내 것으로 바꿔서 보내세요.</div>");
    $("cCopy").onclick=()=>{try{navigator.clipboard.writeText(SAMPLE);$("cCopy").textContent="✅ 복사됐어요! AI 앱에 붙여넣기 하세요"}catch(e){$("cCopy").textContent="문장을 길게 눌러서 복사해 주세요"}};
  }else{
    $("gt").textContent=STEPS[idx].t;$("hint").textContent=(idx+1)+"단계 · "+STEPS[idx].t;$("gc").innerHTML="<b>⚠ 헷갈리는 점</b> "+STEPS[idx].c;
  }
  $("bPrev").disabled=idx===0;
  speak();
}
function speak(){try{speechSynthesis.cancel();if(tts&&"speechSynthesis" in window){const u=new SpeechSynthesisUtterance($("gt").textContent);u.lang="ko-KR";u.rate=.9;speechSynthesis.speak(u)}}catch(e){}}

function act(tg){ // 사용자가 누른 것 처리
  if(busy||idx>LAST)return;
  if(tg!==STEPS[idx].tg)return;
  if(tg==="send"){
    busy=true;send.className="";
    bub("me",idx===0?Q1:Q2);setInp("");scrollEnd();
    const ty=bub("ai typing","<span></span><span></span><span></span>");scrollEnd();
    setTimeout(()=>{ty.remove();busy=false;build(idx+1)},1600/spd);
  }else if(tg==="final"){idx=LAST+1;render()}
  else{build(idx+1)}
}
send.onclick=()=>{if(mode==="try")act("send")};
chat.addEventListener("click",e=>{if(mode!=="try")return;
  const b=e.target.closest("#tTight,#tNeed,#tCheck,#final");if(b)act(b.id)});

// 따라보기(자동 재생)
const fg=$("fg");
function fingerTo(el,cb){
  const r=el.getBoundingClientRect();
  fg.style.display="block";fg.style.left=(r.left+r.width/2-16)+"px";fg.style.top=(r.top+Math.min(r.height/2,40)-16)+"px";
  setTimeout(()=>{fg.classList.add("tap");setTimeout(()=>{fg.classList.remove("tap");cb()},250)},900/spd);
}
function autoStep(){
  if(!playing)return;
  if(idx>LAST){playing=false;fg.style.display="none";$("bPlay").textContent="▶ 재생";return}
  const wait=(speakLen()*70+1800)/spd;
  timer=setTimeout(()=>{
    const tg=STEPS[idx].tg,el=$(tg);if(!el){playing=false;return}
    if(tg==="tTight"||tg==="tNeed"||tg==="tCheck")scrollTo(el);
    fingerTo(el,()=>{act(tg);timer=setTimeout(autoStep,tg==="send"?2200/spd:200)});
  },wait);
}
function speakLen(){return($("gt").textContent+$("gc").textContent).length*0.5}
function play(){if(playing){playing=false;clearTimeout(timer);$("bPlay").textContent="▶ 재생";fg.style.display="none";return}
  if(idx>LAST)build(0);playing=true;$("bPlay").textContent="⏸ 멈춤";autoStep()}

function setMode(m){mode=m;playing=false;clearTimeout(timer);fg.style.display="none";
  $("mWatch").classList.toggle("on",m==="watch");$("mTry").classList.toggle("on",m==="try");
  $("bPlay").style.display=m==="watch"?"":"none";$("bPlay").textContent="▶ 재생";build(0)}
$("mWatch").onclick=()=>setMode("watch");$("mTry").onclick=()=>setMode("try");
$("bPrev").onclick=()=>{playing=false;clearTimeout(timer);build(Math.max(0,Math.min(idx,LAST+1)-1))};
$("bRe").onclick=()=>{playing=false;clearTimeout(timer);fg.style.display="none";build(0)};
$("bPlay").onclick=play;
$("spd").onchange=e=>{spd=parseFloat(e.target.value)};
$("bTts").onclick=()=>{tts=!tts;$("bTts").textContent=tts?"🔊 읽어주기 끄기":"🔇 읽어주기 켜기";if(!tts)try{speechSynthesis.cancel()}catch(e){}else speak()};

(function init(){
  const p=new URLSearchParams(location.search);
  if(p.get("tts")!=="1"){tts=false;$("bTts").textContent="🔇 읽어주기 켜기"}
  if(p.get("speed")){spd=parseFloat(p.get("speed"))||1;const s=$("spd");[...s.options].forEach(o=>{if(parseFloat(o.value)===spd)s.value=o.value})}
  if(p.get("mode")==="watch"){setMode("watch");if(p.get("autoplay")==="1")setTimeout(play,800)}else build(0);
})();
</script>
</body>
</html>
